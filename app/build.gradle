plugins { id 'com.android.application' }

def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.jjw.budget'
    compileSdk 34
    defaultConfig {
        applicationId "com.jjw.budget"
        minSdk 26
        targetSdk 34
        versionCode run
        versionName "1.0." + run
    }
    signingConfigs {
        // 고정 키: 새 버전을 덮어 설치해도 데이터가 유지되도록 같은 서명을 씀
        fixed {
            storeFile file("budget.keystore")
            storePassword "budgetapp"
            keyAlias "budget"
            keyPassword "budgetapp"
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.fixed }
        debug { signingConfig signingConfigs.fixed }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { checkReleaseBuilds false; abortOnError false }
}
