name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk budget-app.apk
      - uses: actions/upload-artifact@v4
        with:
          name: budget-app
          path: budget-app.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 봉투 가계부 v1.0.${{ github.run_number }}
          body: 휴대폰에서 아래 budget-app.apk를 눌러 받아 설치하세요. 새 버전은 그냥 덮어 설치하면 데이터가 유지돼요.
          files: budget-app.apk
          make_latest: true
